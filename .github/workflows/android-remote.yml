name: Android remote app

on:
  push:
    branches:
      - feature/android-remote-connection
    paths:
      - "android/**"
      - ".github/workflows/android-remote.yml"
      - "r2.c"
      - "r2.h"
      - "shell.c"
      - "shell.h"
      - "r2_diary.c"
      - "r2_diary.h"
      - "Log.c"
      - "Log.h"
      - "Remote.c"
      - "Remote.h"
      - "Visual.c"
      - "Visual.h"
      - "Ears.c"
      - "Ears.h"
      - "Eyes.c"
      - "Eyes.h"
      - "V-Webcam.py"
      - "R2_Launch_Code.sh"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-remote.yml"
  workflow_dispatch:

concurrency:
  group: r2-remote-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: r2-remote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  compile-r2-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install R2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libsqlite3-dev libjson-c-dev libpulse-dev

      - name: Check Python and launcher syntax
        run: |
          python3 -m py_compile V-Webcam.py
          bash -n R2_Launch_Code.sh
      - name: Compile R2 core and remote gateway
        run: |
          gcc -std=c11 -Wall -Wextra -O2 \
            r2.c shell.c r2_diary.c Log.c Visual.c Remote.c Ears.c Eyes.c \
            -o /tmp/r2-remote-check \
            -lcurl -lsqlite3 -lpthread -ljson-c -lpulse-simple -lpulse -lm
