name: R2 build

on:
  push:
    branches:
      - main
      - fix/text-model-network-and-sensory-continuity
      - r2-audit-fixes-2026-10-09
      - r2-complete-audit-2026-10-09
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libsqlite3-dev libjson-c-dev libpulse-dev

      - name: Check every shell script for syntax errors
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Check observer syntax and privacy allowlist
        run: |
          python3 -m py_compile Observer.py tests/observer_filter_smoke.py
          python3 tests/observer_filter_smoke.py

      - name: Exercise Alternate-Self Lab persistence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -I. \
            -DR2_DIARY_DATABASE='"/tmp/r2-altself-smoke/r2_memory.db"' \
            tests/alternate_self_smoke.c AlternateSelf.c -lsqlite3 -lpthread \
            -o /tmp/r2-altself-smoke-test
          /tmp/r2-altself-smoke-test

      - name: Compile R2 with the same sources and flags as the launcher
        run: make clean all CFLAGS="-std=c11 -Wall -Wextra -Werror -O2"
