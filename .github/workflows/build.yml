name: R2 build

on:
  push:
    branches:
      - main
      - fix/text-model-network-and-sensory-continuity
      - r2-audit-fixes-2026-10-09
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libsqlite3-dev libjson-c-dev libpulse-dev

      - name: Check launcher syntax
        run: bash -n R2_Launch_Code.sh

      - name: Compile R2 with the same sources and flags as the launcher
        run: make clean all
