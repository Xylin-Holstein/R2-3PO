name: R2 build

on:
  push:
    branches:
      - main
      - 'fix/**'
      - fix/text-model-network-and-sensory-continuity
      - r2-audit-fixes-2026-10-09
      - r2-complete-audit-2026-10-09
      - r2-hunger-reflection-fix-2026-10-10
      - r2-hardware-chat-pipeline-2026-10-11
      - b2.5w2-system-prompt-budget-2026-10-11
      - consolidate/b2-5w2-latest-audit-2026-10-11
      - deploy/r2-hardware-ready-2026-10-11
  pull_request:
    branches:
      - main
      - clean-copy-r2-audit-2026-10-09
      - r2-hunger-reflection-fix-2026-10-10
      - consolidate/b2-5w2-latest-audit-2026-10-11
      - deploy/r2-hardware-ready-2026-10-11
  workflow_dispatch:

concurrency:
  group: r2-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libsqlite3-dev libjson-c-dev libpulse-dev python3-tk

      - name: Check consistent strict build configuration
        run: |
          python3 -m py_compile tests/build_configuration_smoke.py
          python3 tests/build_configuration_smoke.py

      - name: Check every shell script for syntax errors
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Check read-only hardware deployment preflight
        run: |
          bash -n tools/preflight_r2_hardware.sh
          python3 -m py_compile tests/r2_hardware_preflight_smoke.py
          python3 tests/r2_hardware_preflight_smoke.py
      - name: Check deployment audit utilities and read-only database behavior
        run: |
          python3 -m py_compile tools/audit_r2_databases.py tools/audit_r2_sound_assets.py
          ROOT="$(mktemp -d)"
          set +e
          python3 tools/audit_r2_databases.py --root "$ROOT" --json > "$ROOT/report.json"
          STATUS=$?
          set -e
          test "$STATUS" -eq 2
          python3 - "$ROOT/report.json" "$ROOT" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          root = pathlib.Path(sys.argv[2])
          assert report["read_only"] is True
          assert len(report["summary"]["missing"]) == 5
          assert report["summary"]["integrity_failures"] == []
          assert not any((root / name).exists() for name in (
              "r2_memory.db", "r2_reality.db", "r2_fridge.db",
              "r2_rewards.db", "r2_addictions.db"
          )), "read-only audit must not initialize missing databases"
          print("Deployment audit utilities compile and missing-database audit is non-mutating.")
          PY

      - name: Check observer syntax and privacy allowlist
        run: |
          python3 -m py_compile Observer.py tests/observer_filter_smoke.py
          python3 tests/observer_filter_smoke.py

      - name: Check local Ollama readiness probe without network access
        run: |
          python3 -m py_compile tools/preflight_ollama_model.py tests/ollama_preflight_smoke.py
          python3 tests/ollama_preflight_smoke.py

      - name: Check unified Gemma 3 conversation and vision wiring
        run: python3 tests/gemma3_model_smoke.py

      - name: Keep retrieved context separate from the active user turn
        run: python3 tests/current_turn_context_smoke.py

      - name: Keep diagnostics out of the interactive conversation stream
        run: python3 tests/console_diagnostics_isolation_smoke.py

      - name: Check bounded RAM context cache and hardware telemetry
        run: python3 tests/context_cache_smoke.py

      - name: Prevent archived dialogue from becoming an assistant instruction or answer
        run: python3 tests/archive_prompt_smoke.py

      - name: Prevent silent truncation of the complete system prompt
        run: python3 tests/prompt_budget_smoke.py

      - name: Check Ollama mixed CPU/GPU layer placement
        run: python3 tests/ollama_gpu_offload_smoke.py

      - name: Keep the current user turn in bounded Ollama payloads
        run: python3 tests/ollama_current_turn_smoke.py

      - name: Retry obvious nonresponsive text misclassification once
        run: python3 tests/nonresponsive_reply_retry_smoke.py

      - name: Exercise the production reply-misclassification guard
        run: |
          ROOT=/tmp/r2-reply-misclassification-smoke
          rm -rf "$ROOT"
          mkdir -p "$ROOT/R2"
          FLAGS="-std=c11 -Wall -Wextra -Werror -O2 -I. -DR2_ROOT=\"$ROOT\" -DR2_HOME=\"$ROOT/R2\" -DR2_WORKSPACE=\"$ROOT\" -DR2_DIARY_DATABASE=\"$ROOT/R2/r2_memory.db\" -DR2_DIARY_DIR=\"$ROOT/R2_Diary\""
          cc $FLAGS tests/r2_reply_misclassification_smoke.c shell.c r2_diary.c Log.c Reality.c Addiction.c Reward.c AlternateSelf.c Visual.c Ears.c Eyes.c R2Sounds.c R2Reply.c -o /tmp/r2-reply-misclassification-smoke-test -lcurl -lsqlite3 -lpthread -ljson-c -lpulse-simple -lpulse -lm
          /tmp/r2-reply-misclassification-smoke-test

      - name: Check runtime headroom and backwards-compatible memory migration
        run: python3 tests/runtime_headroom_smoke.py

      - name: Exercise real legacy memory database migration
        run: |
          ROOT=/tmp/r2-memory-schema-smoke
          rm -rf "$ROOT"
          mkdir -p "$ROOT/R2"
          FLAGS="-std=c11 -Wall -Wextra -Werror -O2 -I. -DR2_ROOT=\"$ROOT\" -DR2_HOME=\"$ROOT/R2\" -DR2_WORKSPACE=\"$ROOT\" -DR2_DIARY_DATABASE=\"$ROOT/R2/r2_memory.db\" -DR2_DIARY_DIR=\"$ROOT/R2_Diary\""
          cc $FLAGS tests/memory_schema_migration_smoke.c shell.c r2_diary.c Log.c Reality.c Addiction.c Reward.c AlternateSelf.c Visual.c Ears.c Eyes.c R2Sounds.c R2Reply.c -o /tmp/r2-memory-schema-smoke-test -lcurl -lsqlite3 -lpthread -ljson-c -lpulse-simple -lpulse -lm
          /tmp/r2-memory-schema-smoke-test

      - name: Check Game Boy console syntax and lifecycle
        run: |
          python3 -m py_compile GameBoyAdvance.py tests/gameboy_console_smoke.py
          python3 tests/gameboy_console_smoke.py

      - name: Exercise Game Boy installer and desktop entry
        run: bash tests/gameboy_install_smoke.sh

      - name: Exercise CRT TV state reader and control client
        run: |
          python3 -m py_compile TV.py tests/tv_display_smoke.py
          python3 tests/tv_display_smoke.py

      - name: Exercise TV room-device installer
        run: bash tests/tv_install_smoke.sh

      - name: Exercise physical money wallet authority and restart behavior
        run: |
          ROOT=/tmp/r2-wallet-smoke
          rm -rf "$ROOT" /tmp/r2-wallet-smoke-r2.o /tmp/r2-wallet-smoke-test
          FLAGS="-std=c11 -Wall -Wextra -Werror -O2 -I. -DR2_ROOT=\"$ROOT\" -DR2_HOME=\"$ROOT/R2\" -DR2_WORKSPACE=\"$ROOT\" -DR2_DIARY_DATABASE=\"$ROOT/R2/r2_memory.db\" -DR2_DIARY_DIR=\"$ROOT/R2_Diary\""
          cc $FLAGS -Dmain=r2_program_main -c r2.c -o /tmp/r2-wallet-smoke-r2.o
          cc $FLAGS tests/money_wallet_smoke.c shell.c r2_diary.c Log.c Reality.c Addiction.c Reward.c AlternateSelf.c Visual.c Ears.c Eyes.c R2Sounds.c R2Reply.c /tmp/r2-wallet-smoke-r2.o -o /tmp/r2-wallet-smoke-test -lcurl -lsqlite3 -lpthread -ljson-c -lpulse-simple -lpulse -lm
          /tmp/r2-wallet-smoke-test

      - name: Exercise shared Ollama request-gate serialization
        run: |
          ROOT=/tmp/r2-wallet-smoke
          FLAGS="-std=c11 -Wall -Wextra -Werror -O2 -I. -DR2_ROOT=\"$ROOT\" -DR2_HOME=\"$ROOT/R2\" -DR2_WORKSPACE=\"$ROOT\" -DR2_DIARY_DATABASE=\"$ROOT/R2/r2_memory.db\" -DR2_DIARY_DIR=\"$ROOT/R2_Diary\""
          cc $FLAGS tests/ollama_gate_smoke.c shell.c r2_diary.c Log.c Reality.c Addiction.c Reward.c AlternateSelf.c Visual.c Ears.c Eyes.c R2Sounds.c R2Reply.c /tmp/r2-wallet-smoke-r2.o -o /tmp/r2-ollama-gate-smoke -lcurl -lsqlite3 -lpthread -ljson-c -lpulse-simple -lpulse -lm
          /tmp/r2-ollama-gate-smoke

      - name: Exercise Alternate-Self Lab persistence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -I. \
            -DR2_DIARY_DATABASE='"/tmp/r2-altself-smoke/r2_memory.db"' \
            tests/alternate_self_smoke.c AlternateSelf.c -lsqlite3 -lpthread \
            -o /tmp/r2-altself-smoke-test
          /tmp/r2-altself-smoke-test

      - name: Exercise diary, Life Log, and memory reconnection
        run: |
          rm -rf /tmp/r2-diary-smoke
          cc -std=c11 -Wall -Wextra -Werror -O2 -I. \
            -DR2_ROOT='"/tmp/r2-diary-smoke"' \
            -DR2_HOME='"/tmp/r2-diary-smoke/R2"' \
            -DR2_WORKSPACE='"/tmp/r2-diary-smoke"' \
            -DR2_DIARY_DATABASE='"/tmp/r2-diary-smoke/R2/r2_memory.db"' \
            -DR2_DIARY_DIR='"/tmp/r2-diary-smoke/R2_Diary"' \
            tests/diary_integration_smoke.c r2_diary.c Reward.c -lsqlite3 -lpthread \
            -o /tmp/r2-diary-integration-smoke
          /tmp/r2-diary-integration-smoke

      - name: Exercise Reality hunger, sleepiness, and energy progression
        run: |
          ROOT=/tmp/r2-needs-smoke
          rm -rf "$ROOT" /tmp/r2-needs-smoke-r2.o /tmp/r2-needs-smoke-test
          FLAGS="-std=c11 -Wall -Wextra -Werror -O2 -I. -DR2_ROOT=\"$ROOT\" -DR2_HOME=\"$ROOT/R2\" -DR2_WORKSPACE=\"$ROOT\" -DR2_DIARY_DATABASE=\"$ROOT/R2/r2_memory.db\" -DR2_DIARY_DIR=\"$ROOT/R2_Diary\""
          cc $FLAGS -Dmain=r2_program_main -c r2.c -o /tmp/r2-needs-smoke-r2.o
          cc $FLAGS tests/reality_needs_smoke.c shell.c r2_diary.c Log.c Reality.c Addiction.c Reward.c AlternateSelf.c Visual.c Ears.c Eyes.c R2Sounds.c R2Reply.c /tmp/r2-needs-smoke-r2.o -o /tmp/r2-needs-smoke-test -lcurl -lsqlite3 -lpthread -ljson-c -lpulse-simple -lpulse -lm
          /tmp/r2-needs-smoke-test

      - name: Check fridge context against real inventory semantics
        run: python3 tests/fridge_context_smoke.py

      - name: Prevent double-eating during autonomous needs checks
        run: python3 tests/test_autonomous_needs_safeguard.py

      - name: Check unified memory/reality/reward/addiction context wiring
        run: python3 tests/context_integration_smoke.py

      - name: Test non-destructive R2 database preflight
        run: |
          python3 -m py_compile tools/audit_r2_databases.py tests/test_database_preflight.py
          python3 tests/test_database_preflight.py

      - name: Exercise state-aware R2 sound selection and reply markers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -I. tests/r2_sounds_smoke.c R2Sounds.c -lpthread -o /tmp/r2-sounds-smoke
          /tmp/r2-sounds-smoke
          python3 -m py_compile tests/r2_sound_wiring_smoke.py
          python3 tests/r2_sound_wiring_smoke.py

      - name: Prevent private reasoning from leaking into user-facing replies
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -I. tests/r2_reply_smoke.c R2Reply.c -o /tmp/r2-reply-smoke
          /tmp/r2-reply-smoke

      - name: Audit sound asset inventory without touching audio payloads
        run: |
          python3 -m py_compile tools/audit_r2_sound_assets.py tests/test_sound_asset_audit.py
          python3 tests/test_sound_asset_audit.py

      - name: Check overnight service mode and supervisor wiring
        run: |
          python3 -m py_compile tests/r2_overnight_service_smoke.py
          python3 tests/r2_overnight_service_smoke.py

      - name: Compile R2 with the same sources and flags as the launcher
        run: make clean all CFLAGS="-std=c11 -Wall -Wextra -Werror -O2"

      - name: Run isolated overnight SIGTERM lifecycle integration
        run: |
          python3 -m py_compile tests/r2_service_signal_integration.py
          python3 tests/r2_service_signal_integration.py
